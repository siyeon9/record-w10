<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>[내 레코드 제목]</title>
<style>
@font-face{font-family:"GS";src:url("fonts/Geist-Variable.woff2") format("woff2-variations"),url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"GM";src:url("fonts/GeistMono-Variable.woff2") format("woff2-variations"),url("fonts/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"PTD";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 930;font-display:swap}

/* 10주 디자인 시스템 — Teenage Engineering(teenage.engineering) 실측 2026-10-26
   흰 바탕 #FFF · 제품 바탕 #F5F5F5 · 검정 #0F0E12 · 회색 #E5E5E5 / #B2B2B2 / #767676
   포인트 오렌지 #F05A24 (버튼·LED·EQ에만) · 노랑 #FAB413 · 파랑 #0071BB (LED 한 점씩)
   서체 te-20(전용) → Geist 100·300 / 숫자·라벨 Geist Mono / 한글 Pretendard 200·300
   간격은 화면 폭 980 기준 비율(--u) · 모서리는 기계처럼 작게(2~6px) · 그림자 거의 없음 */
:root{
  --white:#fff; --paper:#f5f5f5; --black:#0f0e12; --g100:#e5e5e5; --g200:#ccc; --g300:#b2b2b2; --g600:#767676; --g900:#4d4d4d;
  --orange:#f05a24; --yellow:#fab413; --blue:#0071bb;
  --u:calc(min(100vw,1400px)/980);
  --sans:"GS","PTD",system-ui,sans-serif; --mono:"GM","PTD",ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--black);font:300 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
p,h1,h2,h3{text-wrap:pretty;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid var(--orange);outline-offset:3px}
.mono{font-family:var(--mono);font-size:10px;line-height:1.1;letter-spacing:.02em;text-transform:lowercase}
.wrap{max-width:1400px;margin:0 auto;padding:0 calc(var(--u)*20)}

/* 머리 — 두 줄 소문자 로고 + 아이콘 메뉴 */
header{display:flex;align-items:flex-start;gap:calc(var(--u)*34);padding:calc(var(--u)*20) calc(var(--u)*20) 0;max-width:1400px;margin:0 auto}
.logo{font-size:16px;line-height:1.15;font-weight:300;min-width:120px;white-space:pre-line}
nav{display:flex;gap:calc(var(--u)*30);flex-wrap:wrap}
nav a{display:flex;gap:8px;color:inherit;text-decoration:none;align-items:flex-start}
nav svg{width:26px;height:26px;flex:none}
nav b{display:block;font-weight:300;font-size:16px;line-height:1}
nav small{display:block;color:var(--g600);font-family:var(--mono);font-size:9px;line-height:1.25;margin-top:5px}

/* 첫 화면 */
.hero{display:grid;grid-template-columns:minmax(180px,.9fr) 2.1fr;gap:calc(var(--u)*30);padding-top:calc(var(--u)*40)}
.series b{display:block;font-weight:300;font-size:calc(var(--u)*30);line-height:.95;letter-spacing:-.01em;white-space:pre-line}
.series .tag{display:inline-block;background:var(--orange);color:#fff;font:300 11px/1 var(--mono);padding:3px 7px 2px;margin:8px 0 14px}
.series ol{list-style:none;margin:0;padding:0}
.series li button{display:flex;gap:10px;align-items:baseline;width:100%;padding:2px 0;font:300 11px/1.3 var(--mono);color:var(--g600);text-align:left}
.series li button::after{content:"";flex:1;border-bottom:1px dotted var(--orange);transform:translateY(-3px)}
.series li button span{color:var(--black)}
.series li button[aria-current="true"] span{color:var(--orange)}
.lead h1{font-weight:100;font-size:clamp(44px,calc(var(--u)*84),124px);line-height:.92;letter-spacing:-.035em;white-space:pre-line}
.lead p{margin-top:calc(var(--u)*18);max-width:34em;color:var(--g900);font-size:17px;line-height:1.55;white-space:pre-line}
.lead .by{margin-top:14px;color:var(--g600)}

/* 플레이어 — CD 랙 + 턴테이블 기기 */
.player{display:grid;grid-template-columns:clamp(84px,calc(var(--u)*90),122px) minmax(0,1fr);gap:calc(var(--u)*18);align-items:stretch;margin-top:calc(var(--u)*30)}
.rack{position:relative;display:grid;grid-template-rows:auto repeat(5,minmax(0,1fr));justify-items:center;min-height:0;gap:clamp(6px,calc(var(--u)*9),12px);padding:12px 10px;background:linear-gradient(90deg,#e9e9e9,#f3f3f3);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.rack .cap{display:flex;justify-content:space-between;color:var(--g600);margin-bottom:2px;width:100%}
.case{position:relative;display:block;height:100%;max-width:100%;aspect-ratio:1;min-height:0;border-radius:2px;background:var(--g100) center/cover no-repeat;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 14px -12px rgba(15,14,18,.6);transition:transform .7s var(--ease),box-shadow .5s}
.case::before{content:"";position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,.34),rgba(255,255,255,0) 9%,rgba(255,255,255,0) 86%,rgba(255,255,255,.18));pointer-events:none}
.case::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:rgba(15,14,18,.14);border-radius:2px 0 0 2px}
.case .n{position:absolute;left:-1px;top:-1px;z-index:2;background:var(--white);padding:2px 4px 1px;font:300 9px/1 var(--mono);border-radius:0 0 2px 0}
.case:hover{transform:translateX(5px)}
.case[aria-current="true"]{transform:translateX(12px) scale(1.04);box-shadow:0 1px 0 rgba(0,0,0,.08),0 18px 24px -14px rgba(15,14,18,.7)}
.case[aria-current="true"] .n{background:var(--orange);color:#fff}
.case.out{opacity:.25}

.deck{position:relative;display:grid;grid-template-columns:clamp(30px,6%,70px) minmax(0,1fr) minmax(0,.92fr);gap:0;align-items:stretch;background:linear-gradient(#ececec,#e2e2e2);border-radius:6px;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,0,0,.06),0 40px 60px -50px rgba(15,14,18,.55);overflow:hidden}
.deck::before{content:"";position:absolute;inset:1.4%;border:1px solid rgba(0,0,0,.05);border-radius:4px;pointer-events:none}
/* 구성은 디터 람스(Braun SK 4 · PS 2)식 — 왼쪽 슬롯 그릴 · 가운데 플래터 · 오른쪽 조작부. 색과 버튼은 10주 시스템(teenage engineering) 회색 톤 */
.deck .grille{margin:14% 0 14% 34%;background:repeating-linear-gradient(90deg,#9a9a9a 0 2px,transparent 2px 6px);border-radius:1px;opacity:.75}
.deck .bay{margin:7% 4% 7% 6%}
.deck .panel{padding:6% 7% 6% 3%}

.bay{position:relative;aspect-ratio:1;align-self:center}
.platter{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a393d 0 47%,#2a292d 47.5% 49.5%,#cfcfcf 50% 50.6%,#bdbdbd 51% 100%);box-shadow:inset 0 0 0 2px #d6d6d6,0 1px 0 #fff}
.platter::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.18) 0 1deg,transparent 1deg 6deg);-webkit-mask:radial-gradient(circle,transparent 0 49.4%,#000 49.6% 51%,transparent 51.2%);mask:radial-gradient(circle,transparent 0 49.4%,#000 49.6% 51%,transparent 51.2%)}
.disc{position:absolute;inset:3.5%;border-radius:50%;will-change:transform;transition:transform 1.1s var(--ease),opacity .4s}
.disc.out{transform:translateX(-135%) scale(.5);opacity:0}
.spin{position:absolute;inset:0;border-radius:50%}
.lp{background:radial-gradient(circle,transparent 0 31%,#111 31.3% 100%),repeating-radial-gradient(circle,#17161a 0 1px,#0c0b0e 1px 2.4px);box-shadow:0 0 0 1px #000}
.lp::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 8%,rgba(255,255,255,.12) 12%,transparent 18% 52%,rgba(255,255,255,.09) 58%,transparent 64%)}
.lp .label{position:absolute;inset:31%;border-radius:50%;background:var(--paper) center/cover no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.cd{background:conic-gradient(from 0deg,#e9ecef,#d9f0ff,#ffe8f3,#fff6d6,#e3ffe9,#e0e6ff,#e9ecef);box-shadow:0 0 0 1px #bfc4c9}
.cd .label{position:absolute;inset:9%;border-radius:50%;background:center/cover no-repeat;-webkit-mask:radial-gradient(circle,transparent 0 23%,#000 23.5%);mask:radial-gradient(circle,transparent 0 23%,#000 23.5%);opacity:.92;mix-blend-mode:multiply}
.cd::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,var(--paper) 0 34%,rgba(255,255,255,.55) 35% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.spindle{position:absolute;left:50%;top:50%;width:3.2%;aspect-ratio:1;margin:-1.6% 0 0 -1.6%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9a9a9a);z-index:3}
.arm{position:absolute;right:-8%;top:-4%;width:16%;aspect-ratio:1;z-index:4}
.arm .base{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fafafa,#bdbdbd);box-shadow:0 2px 3px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.06)}
.arm .tube{position:absolute;left:50%;top:50%;width:5%;height:470%;margin-left:-2.5%;background:linear-gradient(90deg,#d8d8d8,#f6f6f6 50%,#bcbcbc);border-radius:3px;transform-origin:50% 0;transform:rotate(14deg);transition:transform 1.1s var(--ease)}
.arm .head{position:absolute;left:50%;bottom:-3%;width:max(9px,320%);height:7%;transform:translateX(-50%);background:var(--black);border-radius:2px}
.arm .head::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:9px;margin-left:-1.5px;background:var(--orange)}
.deck.on .arm .tube{transform:rotate(31deg)}

.panel{display:flex;flex-direction:column;gap:clamp(10px,calc(var(--u)*13),18px);min-width:0;position:relative;z-index:2}
/* 기기 화면 — YouTube 플레이어가 보이는 자리 */
.tv{position:relative;aspect-ratio:16/9;min-height:200px;background:#000;border-radius:3px;box-shadow:inset 0 0 0 2px #232227;overflow:hidden}
.tv iframe,.tv #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.tv .off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8%;text-align:center;color:#f5f5f5;font:300 12px/1.45 var(--mono);background:#0f0e12 center/cover no-repeat;z-index:2}
.tv .off::before{content:"";position:absolute;inset:0;background:rgba(15,14,18,.72)}
.tv .off > *{position:relative}
.tv .off a{color:#fff;text-decoration:none;border:1px solid var(--orange);background:var(--orange);padding:7px 10px;border-radius:2px;font:300 11px/1 var(--mono)}
.tv.live .off{display:none}
.lcd{background:var(--black);border-radius:3px;color:#f5f5f5;padding:clamp(10px,calc(var(--u)*13),20px);font-family:var(--mono);font-size:clamp(9px,calc(var(--u)*10.5),12.5px);line-height:1.35;box-shadow:inset 0 0 0 2px #232227;position:relative;overflow:hidden}
.lcd .row{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
.lcd .t{font-size:1.45em;line-height:1.1;margin:.4em 0 .1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300;letter-spacing:-.01em}
.lcd .a{color:var(--g300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .hot{color:var(--orange)}
.eq{display:flex;align-items:flex-end;gap:3%;height:clamp(18px,calc(var(--u)*24),34px);margin-top:clamp(8px,calc(var(--u)*10),14px)}
.eq i{flex:1;background:var(--orange);height:8%;border-radius:1px;transition:height .08s linear}
.eq i:nth-child(n+11){background:#f5f5f5}
/* 조작부 — 키 넷(이전 · 재생 · 정지 · 다음) + 두 칸 스위치 둘(33/45 · LP/CD). 키 모양은 이전 판 그대로 */
.ctrls{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(8px,calc(var(--u)*12),18px);align-items:stretch}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,calc(var(--u)*7),11px)}
.key,.sw span{aspect-ratio:1.15;border-radius:4px;background:linear-gradient(#fbfbfb,#e8e8e8);box-shadow:0 2px 0 #c8c8c8,0 3px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:300 clamp(10px,calc(var(--u)*13),16px)/1 var(--mono);color:var(--black);transition:transform .08s,box-shadow .08s,background .2s,color .2s}
.key small,.sw small{font-size:.55em;color:var(--g600)}
.key:active,.sw:active span{transform:translateY(2px);box-shadow:0 0 0 #c8c8c8,0 1px 2px rgba(0,0,0,.08)}
.key.go{background:linear-gradient(#ff7440,var(--orange));color:#fff;box-shadow:0 2px 0 #b8401a}
.key.go small{color:#ffe1d4}
.sw[aria-pressed="false"] span:first-child small,.sw[aria-pressed="true"] span:last-child small{color:var(--g300)}
.sws{display:grid;grid-template-rows:1fr 1fr;gap:clamp(5px,calc(var(--u)*7),11px);min-height:0}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,calc(var(--u)*7),11px);min-height:0}
.sw span{aspect-ratio:auto;height:100%;min-height:0;flex-direction:row;gap:5px;font-size:clamp(9px,calc(var(--u)*11),13px)}
.sw[aria-pressed="false"] span:first-child,.sw[aria-pressed="true"] span:last-child{background:linear-gradient(#2a292e,#141317);color:#f5f5f5;box-shadow:0 2px 0 #000}
.top{display:flex;align-items:center;justify-content:space-between;color:var(--g600)}
.led{width:7px;height:7px;border-radius:50%;background:#cfcfcf;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);display:inline-block;margin-right:6px;vertical-align:-1px}
.deck.on .led{background:var(--orange);box-shadow:0 0 8px var(--orange)}

/* 지금 도는 곡 */
.now{display:grid;grid-template-columns:clamp(84px,calc(var(--u)*90),122px) minmax(0,1fr);gap:calc(var(--u)*18);margin-top:calc(var(--u)*22);padding-top:calc(var(--u)*14);border-top:1px solid var(--g100)}
.now .k{color:var(--g600)}
.now h2{font-weight:100;font-size:clamp(32px,calc(var(--u)*52),78px);line-height:1;letter-spacing:-.03em}
.now .who{margin-top:8px;font-size:17px;color:var(--g900)}
.now .why{margin-top:calc(var(--u)*14);font-size:18px;line-height:1.6;max-width:36em;white-space:pre-line}
.now .meta{margin-top:12px;color:var(--g600)}
.now .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.now .acts a,.now .acts button{display:inline-flex;gap:8px;align-items:center;font:300 12px/1 var(--mono);border:1px solid var(--black);padding:8px 12px;border-radius:2px;color:inherit;text-decoration:none}
.now .acts a:hover,.now .acts button:hover{background:var(--black);color:#fff}
.swap{animation:swap .7s var(--ease) both}
@keyframes swap{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* 라이너 노트 */
.notes{margin-top:calc(var(--u)*80);background:var(--black);color:#f5f5f5}
.notes .wrap{display:grid;grid-template-columns:clamp(84px,calc(var(--u)*90),122px) minmax(0,1fr);gap:calc(var(--u)*18);padding-top:calc(var(--u)*70);padding-bottom:calc(var(--u)*90)}
.notes .mono{color:var(--orange)}
.notes p.big{font-weight:100;font-size:clamp(26px,calc(var(--u)*40),58px);line-height:1.2;letter-spacing:-.02em;white-space:pre-line}
.notes p.sm{margin-top:calc(var(--u)*30);color:var(--g300);max-width:38em;white-space:pre-line}
.notes .credit{margin-top:calc(var(--u)*30);color:var(--g600);line-height:1.6}
.notes .credit a{color:var(--g300)}
footer{background:var(--black);color:var(--g600);border-top:1px solid #232227}
footer .wrap{display:flex;justify-content:space-between;gap:20px;padding-top:18px;padding-bottom:22px}

/* 크게 보기 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.97);display:none;grid-template-columns:minmax(0,1fr) minmax(260px,380px);gap:4vw;align-items:center;padding:5vh 5vw}
.lb.open{display:grid;animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0}}
.lb img{max-height:84vh;max-width:100%;aspect-ratio:1;object-fit:cover;justify-self:center;box-shadow:0 40px 70px -40px rgba(15,14,18,.55);animation:rise .6s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.lb h3{font-weight:100;font-size:40px;line-height:1.02;letter-spacing:-.02em}
.lb p{margin-top:12px;white-space:pre-line}
.lb .ctl{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.lb .ctl button{border:1px solid var(--black);padding:8px 12px;font:300 12px/1 var(--mono);border-radius:2px}
.lb .x{position:absolute;right:22px;top:18px;font:300 12px/1 var(--mono)}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform 1.1s var(--ease)}
.reveal.in{opacity:1;transform:none}

@media (max-width:860px){
  header{flex-direction:column;gap:16px;padding:16px 16px 0}
  nav{gap:18px}
  .wrap{padding:0 16px}
  .hero,.notes .wrap{grid-template-columns:1fr}
  .hero{gap:22px}
  .player,.now{grid-template-columns:1fr;gap:12px}
  .rack{display:flex;flex-direction:row;overflow-x:auto;padding:10px;gap:10px;scroll-snap-type:x mandatory}
  .rack .cap{display:none}
  .case{flex:0 0 22%;height:auto;scroll-snap-align:start}
  .sw span{min-height:30px}
  .case:hover{transform:none}
  .case[aria-current="true"]{transform:translateY(-6px) scale(1.04)}
  .deck{grid-template-columns:minmax(0,1fr)}
  .deck .grille{display:none}
  .deck .bay{margin:18px auto 6px;width:78%}
  .deck .panel{padding:8px 6% 18px}
  .ctrls{grid-template-columns:1fr}
  .disc.out{transform:translateY(-120%) scale(.5)}
  .lb{grid-template-columns:1fr;overflow:auto;align-content:start}
  .lb img{max-height:62vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"></div>
  <nav aria-label="메뉴">
    <a href="#player"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><circle cx="13" cy="13" r="11"/><circle cx="13" cy="13" r="3.5"/><circle cx="13" cy="13" r="7" stroke-dasharray="1 2"/></svg><span><b>records</b><small>five records<br>01 – 05<br>side a</small></span></a>
    <a href="#player"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><rect x="1.5" y="4.5" width="23" height="17" rx="1.5"/><circle cx="9" cy="13" r="5"/><path d="M19 7v8l-3 3"/></svg><span><b>player</b><small>lp · cd<br>33 · 45 rpm<br>eq</small></span></a>
    <a href="#notes"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><path d="M5 2.5h12l4 4v17H5z"/><path d="M9 11h8M9 15h8M9 19h5"/></svg><span><b>notes</b><small>liner notes<br>afterword<br>credit</small></span></a>
  </nav>
</header>

<main>
  <section class="wrap player" id="player" aria-label="플레이어">
    <div class="rack reveal" id="rack" aria-label="레코드 랙"><div class="cap mono"><span>rack</span><span id="rc"></span></div></div>
    <div class="deck reveal" id="deck">
      <div class="grille" aria-hidden="true"></div>
      <div class="bay">
        <div class="platter"></div>
        <div class="disc out" id="disc"><div class="spin lp" id="spin"><div class="label" id="label"></div></div></div>
        <div class="spindle"></div>
        <div class="arm" aria-hidden="true"><div class="base"></div><div class="tube"><div class="head"></div></div></div>
      </div>
      <div class="panel">
        <div class="top mono"><span><i class="led"></i>lp series</span><span id="rc2"></span></div>
        <div class="tv" id="tv"><div id="yt"></div><div class="off" id="off"></div></div>
        <div class="lcd" aria-live="polite">
          <div class="row"><span id="st">■ stop</span><span id="tm">00:00</span></div>
          <div class="t" id="lt">—</div>
          <div class="a" id="la">—</div>
          <div class="eq" id="eq"></div>
          <div class="row" style="margin-top:6px"><span id="lr" class="hot">33 rpm</span><span id="lm">lp</span></div>
        </div>
        <div class="ctrls">
          <div class="keys" id="keys"></div>
          <div class="sws"><button class="sw" data-k="45" aria-label="회전 속도 33 / 45"><span>33<small>rpm</small></span><span>45<small>rpm</small></span></button><button class="sw" data-k="disc" aria-label="판 LP / CD"><span>lp<small>disc</small></span><span>cd<small>disc</small></span></button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="wrap now" id="now" aria-live="polite">
    <div class="k mono" id="nk"></div>
    <div id="nbody"></div>
  </section>

  <section class="notes" id="notes">
    <div class="wrap">
      <div class="mono">liner notes</div>
      <div><p class="big" id="after"></p><p class="sm" id="sum2"></p><p class="credit mono" id="credit"></p></div>
    </div>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="재킷 크게 보기">
  <button class="x" id="lbx">close ✕</button>
  <img id="lbimg" alt="">
  <div><div class="mono" id="lbno"></div><h3 id="lbt"></h3><p id="lbw"></p><p class="mono" id="lbm" style="color:var(--g600)"></p>
  <div class="ctl"><button id="lbp">← prev</button><button id="lbn">next →</button><button id="lbplay">▶ play</button></div></div>
</div>

<script>
(() => {
// YouTube는 127.0.0.1 주소의 임베드를 막고 localhost는 허용한다
if (location.hostname === '127.0.0.1') { location.replace(location.href.replace('//127.0.0.1', '//localhost')); return; }
const D = JSON.parse(document.getElementById('record').textContent);
const T = (D.tracks || []).slice(0, 5);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = s => esc(s).replace(/\\n|\n/g, '<br>');
const name = t => t.title || ('track ' + t.no);
const yt = t => { const y = t.youtube; if (!y) return null; if (typeof y === 'string') return y ? {id: y, start: 0, end: 0} : null; return y.id ? {id: y.id, start: +y.start || 0, end: +y.end || 0} : null; };
const watch = t => { const y = yt(t); return y ? `https://www.youtube.com/watch?v=${y.id}${y.start ? '&t=' + y.start + 's' : ''}` : ''; };
const art = t => t.image || (yt(t) ? `https://i.ytimg.com/vi/${yt(t).id}/maxresdefault.jpg` : '');
document.title = (D.title || '레코드').replace(/\n/g, ' ');
$('sum2').innerHTML = br((D.summary || []).slice(-1)[0]);
$('after').innerHTML = br(D.afterword);
if (T.some(yt)) $('credit').innerHTML = 'sound · youtube<br>' + T.filter(yt).map(t => `${esc(t.no)} ${esc(name(t))} — ${esc(t.artist)} · <a href="${esc(watch(t))}" target="_blank" rel="noopener">youtube ↗</a>`).join('<br>');

let cur = -1, playing = false, mode = 'lp', rpm = 33, t0 = 0, ang = 0, last = 0, spd = 0;

// 목록 · 랙 · 키 · EQ
$('rc').textContent = String(T.length).padStart(2, '0');
$('rack').insertAdjacentHTML('beforeend', T.map((t, i) => `<button class="case" data-i="${i}" aria-label="${esc(t.no)} ${esc(name(t))} 판 갈아끼우기" style="background-image:url('${esc(art(t))}')"><span class="n">${esc(t.no)}</span></button>`).join(''));
T.forEach((t, i) => { const im = new Image(); im.onerror = () => { const alt = yt(t) && t.image ? `https://i.ytimg.com/vi/${yt(t).id}/hqdefault.jpg` : ''; if (alt) { t.image = alt; document.querySelector(`.case[data-i="${i}"]`).style.backgroundImage = `url('${alt}')`; } }; im.src = art(t); });
const K = [['◀◀','prev','이전 곡'],['▶','play','재생 · 멈춤'],['■','stop','정지'],['▶▶','next','다음 곡']];
$('keys').innerHTML = K.map(([a, sm, b]) => `<button class="key${a==='▶'?' go':''}" data-k="${a}" aria-label="${b}">${a}<small>${sm}</small></button>`).join('');
$('rc2').textContent = String(T.length).padStart(2, '0') + ' records';
$('eq').innerHTML = '<i></i>'.repeat(16);
$('logo').textContent = 'LP\nSERIES';
const bars = [...$('eq').children];

// YouTube — 기기 화면에 보이는 플레이어. 로컬 파일(file://)로 열면 YouTube가 막는다
const canYT = /^https?:$/.test(location.protocol) && T.some(yt);
let P = null, ready = false, ytOk = false;
function offMsg(t, why){
  const off = $('off'); $('tv').classList.remove('live');
  off.style.backgroundImage = t && art(t) ? `url('${art(t)}')` : 'none';
  const link = t && watch(t) ? `<a href="${esc(watch(t))}" target="_blank" rel="noopener">▶ youtube에서 듣기 ↗</a>` : '';
  off.innerHTML = `<span>${why}</span>${link}`;
}
if (canYT) {
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  window.onYouTubeIframeAPIReady = () => {
    const f = T.find(yt);
    P = new YT.Player('yt', {videoId: yt(f).id, playerVars: {playsinline: 1, rel: 0, modestbranding: 1, start: yt(f).start || undefined}, events: {
      onReady: () => { ready = true; if (cur >= 0) cue(cur); },
      onStateChange: e => { if (e.data === 1) { ytOk = true; $('tv').classList.add('live'); setPlay(true); } else if (e.data === 2) setPlay(false); else if (e.data === 0) { setPlay(false); setTimeout(() => load((cur + 1) % T.length), 900); } },
      onError: e => { ytOk = false; offMsg(T[cur], e.data === 101 || e.data === 150 ? '이 곡은 다른 사이트에서 재생할 수 없게 막혀 있습니다' : 'youtube 재생이 막혔습니다 (오류 ' + e.data + ')'); }
    }});
  };
}
function cue(i, go){
  const y = yt(T[i]); if (!y) { offMsg(T[i], '이 곡은 youtube 주소가 없습니다'); return; }
  if (!canYT) { offMsg(T[i], location.protocol === 'file:' ? '파일로 열면 youtube가 재생을 막습니다<br>Claude Code에게 "레코드 틀어 줘"라고 하면 로컬 서버로 엽니다' : 'youtube를 불러올 수 없습니다'); return; }
  if (!ready) return;
  $('tv').classList.add('live'); const o = {videoId: y.id, startSeconds: y.start || 0, endSeconds: y.end || undefined}; go ? P.loadVideoById(o) : P.cueVideoById(o);
}

function setKeys(){
  document.querySelector('.sw[data-k="45"]').setAttribute('aria-pressed', rpm === 45 ? 'true' : 'false');
  document.querySelector('.sw[data-k="disc"]').setAttribute('aria-pressed', mode === 'cd' ? 'true' : 'false');
  document.querySelectorAll('.case').forEach(b => b.setAttribute('aria-current', (+b.dataset.i === cur) ? 'true' : 'false'));
  $('deck').classList.toggle('cdmode', mode === 'cd');
  $('lm').textContent = mode; $('lr').textContent = mode === 'cd' ? 'cd · 1x' : rpm + ' rpm';
}
function disc(){ $('spin').className = 'spin ' + mode; const t = T[cur]; $('label').style.backgroundImage = t && art(t) ? `url("${art(t)}")` : 'none'; }
function setPlay(on){ playing = on; $('deck').classList.toggle('on', on); $('st').textContent = on ? '▶ play' : '■ stop'; if (on && !ytOk) t0 = performance.now(); }
function load(i, autoplay = true){
  if (i < 0 || i >= T.length) return;
  const same = i === cur; cur = i; const t = T[i];
  if (P && ready) try { P.pauseVideo(); } catch (e) {}
  ytOk = false;
  setPlay(false);
  // 랙에서 판이 빠져나와 플래터로
  const d = $('disc'); d.classList.add('out');
  setTimeout(() => { disc(); requestAnimationFrame(() => d.classList.remove('out')); }, same ? 50 : 380);
  $('lt').textContent = name(t); $('la').textContent = [t.artist, t.year].filter(Boolean).join(' · ') || '—'; $('tm').textContent = '00:00';
  $('nk').textContent = 'now on the platter · ' + t.no + ' / ' + String(T.length).padStart(2, '0');
  $('nbody').innerHTML = `<div class="swap"><h2>${esc(name(t))}</h2><p class="who">${esc(t.artist)}${t.year ? ' · ' + esc(t.year) : ''}</p>${t.reason ? `<p class="why">${br(t.reason)}</p>` : ''}${t.meta ? `<p class="meta mono">${esc(t.meta)}</p>` : ''}<div class="acts"><button id="zoom">⤢ 재킷 크게 보기</button>${watch(t) ? `<a href="${esc(watch(t))}" target="_blank" rel="noopener">youtube ↗</a>` : ''}</div></div>`;
  $('zoom').onclick = () => openLb(cur);
  setKeys();
  const live = autoplay && canYT && ready && yt(t);
  cue(i, live);   // 클릭 순간에 바로 불러야 브라우저가 소리 재생을 허락한다
  if (autoplay && !live) setTimeout(play, same ? 200 : 1150);
}
function play(){
  if (cur < 0) { load(0); return; }
  if (P && ready && yt(T[cur]) && canYT) { try { P.playVideo(); } catch (e) {} if (!ytOk) setPlay(true); }
  else setPlay(true);
}
function stop(){ if (P && ready) try { P.pauseVideo(); } catch (e) {} setPlay(false); }

function loop(now){
  const dt = Math.min(64, now - (last || now)); last = now;
  const target = playing ? (mode === 'cd' ? 3.2 : rpm / 60 * 360 / 1000) : 0;
  spd += (target - spd) * (playing ? .035 : .05);
  ang = (ang + spd * dt) % 360; $('spin').style.transform = `rotate(${ang}deg)`;
  if (playing) { let s; if (ytOk && P && P.getCurrentTime) { const y = yt(T[cur]); s = Math.max(0, Math.floor(P.getCurrentTime() - (y ? y.start : 0))); } else s = Math.floor((now - t0) / 1000); $('tm').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  bars.forEach((b, i) => b.style.height = (playing ? Math.max(.06, (.55 + .45 * Math.sin(now / (180 + i * 37) + i * 1.7)) * (.35 + .65 * Math.abs(Math.sin(now / 410 + i * .6))) * (1 - i / 26)) * 100 : 6).toFixed(1) + '%');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 키 · 랙 · 노브
$('deck').addEventListener('click', e => {
  const k = e.target.closest('.key, .sw'); if (!k) return; const a = k.dataset.k;
  if (/^[1-5]$/.test(a)) load(+a - 1);
  else if (a === 'disc') { mode = mode === 'lp' ? 'cd' : 'lp'; disc(); setKeys(); }
  else if (a === '45') { rpm = rpm === 33 ? 45 : 33; setKeys(); }
  else if (a === '▶') playing ? stop() : play();
  else if (a === '■') stop();
  else if (a === '◀◀') load((cur - 1 + T.length) % T.length);
  else if (a === '▶▶') load((cur + 1) % T.length);
});
document.addEventListener('click', e => { const b = e.target.closest('.case'); if (!b) return; const i = +b.dataset.i; if (b.classList.contains('case') && i === cur) { openLb(i); return; } load(i); });

// 크게 보기
let lbi = 0;
function openLb(i){ lbi = i; const t = T[i]; $('lbimg').src = art(t); $('lbimg').alt = name(t) + ' 재킷'; $('lbno').textContent = t.no + ' / ' + String(T.length).padStart(2, '0'); $('lbt').textContent = name(t); $('lbw').innerHTML = [esc([t.artist, t.year].filter(Boolean).join(' · ')), br(t.reason)].filter(Boolean).join('<br><br>'); $('lbm').textContent = t.meta || ''; $('lb').classList.add('open'); $('lbx').focus(); }
function closeLb(){ $('lb').classList.remove('open'); }
$('lbx').onclick = closeLb; $('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb(); });
$('lbp').onclick = () => openLb((lbi - 1 + T.length) % T.length);
$('lbn').onclick = () => openLb((lbi + 1) % T.length);
$('lbplay').onclick = () => { closeLb(); load(lbi); $('player').scrollIntoView({behavior: 'smooth', block: 'center'}); };
document.addEventListener('keydown', e => {
  const open = $('lb').classList.contains('open');
  if (open) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') $('lbn').click(); if (e.key === 'ArrowLeft') $('lbp').click(); return; }
  if (/^[1-5]$/.test(e.key)) load(+e.key - 1);
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); playing ? stop() : play(); }
});

// 나타나기
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold: .12});
document.querySelectorAll('.reveal').forEach((el, i) => { el.style.transitionDelay = (i % 5) * 70 + 'ms'; io.observe(el); });
setKeys();
setTimeout(() => load(0, false), 500);
window.__rec = {load, play, stop, state: () => ({cur, playing, mode, rpm, ready, ytOk, yt: P && P.getPlayerState ? P.getPlayerState() : null, t: P && P.getCurrentTime ? P.getCurrentTime() : null})};
})();
</script>
